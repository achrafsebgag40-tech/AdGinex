<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="منصة AdGenix لتوليد المحتوى التسويقي والإعلاني بالذكاء الاصطناعي بضغطة زر واحدة. أنشئ إعلانات ممولة ووصف منتجات احترافي بسهولة.">
    <meta name="keywords" content="توليد محتوى تسويقي, إعلانات ممولة, وصف منتجات, ذكاء اصطناعي, AdGenix">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="AJTIkD27075KnjvUxF7XXKtVX1X8WC_kBGRtKO_ftWY" />
    <title>AdGenix | المنصة الذكية لتوليد المحتوى التسويقي</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #818cf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pro-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .pro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #6366f1;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .generate-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .output-container {
            margin-top: 30px;
            position: relative;
        }

        .output-box {
            background-color: #0f172a;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-height: 150px;
            white-space: pre-line;
            font-size: 15px;
            color: #e2e8f0;
            line-height: 1.7;
        }

        .copy-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ AdGenix AI</div>
        <button class="pro-btn" onclick="openCheckout()">ترقية للباقة الاحترافية ($29/mo)</button>
    </header>

    <div class="container">
        <h1>منصة AdGenix لتوليد المحتوى التسويقي</h1>
        <p class="subtitle">أنشئ أوصافاً تسويقية مذهلة، إعلانات ممولة، ومنشورات تفاعلية لمنصات التواصل الاجتماعي بضغطة زر واحدة.</p>
        
        <div class="form-group">
            <label for="productName">اسم المنتج أو فكرته الأساسية:</label>
            <input type="text" id="productName" placeholder="مثال: سماعات لاسلكية عازلة للضوضاء بطارية تدوم طويلاً">
        </div>

        <div class="form-grid">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="contentType">نوع المحتوى المطلوب:</label>
                <select id="contentType">
                    <option value="description">وصف تسويقي احترافي لمتجر إلكتروني</option>
                    <option value="social">منشورات وسائل التواصل الاجتماعي (تيك توك / انستغرام)</option>
                    <option value="ads">أفكار إعلانات ممولة قصيرة وجذابة</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="toneStyle">نبرة الخطاب (Tone):</label>
                <select id="toneStyle">
                    <option value="persuasive">تسويقي محفز للشراء</option>
                    <option value="professional">رسمي واحترافي</option>
                    <option value="excited">حماسي وجذاب</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" onclick="generateContent()" style="margin-top: 20px;">توليد المحتوى بالذكاء الاصطناعي ⚡</button>

        <div class="output-container">
            <button class="copy-btn" onclick="copyText()">نسخ النص 📋</button>
            <div class="output-box" id="output">
                ستظهر النتائج الاحترافية المولدة هنا فوراً...
            </div>
        </div>
    </div>

    <script>
        function generateContent() {
            const product = document.getElementById('productName').value;
            const type = document.getElementById('contentType').value;
            const tone = document.getElementById('toneStyle').value;
            const outputBox = document.getElementById('output');

            if (!product) {
                alert('الرجاء إدخال اسم المنتج أو فكرته أولاً!');
                return;
            }

            outputBox.innerHTML = "جاري معالجة البيانات وتحليل السوق بواسطة خوارزميات AdGenix AI... ⏳";

            // محاكاة محرك الذكاء الاصطناعي المتقدم
            setTimeout(() => {
                let result = "";
                if (type === 'description') {
                    result = `✨ **الوصف التسويقي الاحترافي:**\n\nهل تعبت من البحث عن الجودة الحقيقية؟ إليك "${product}" المصمم خصيصاً ليغير تجربتك بالكامل.\n\n🔥 **المميزات الرئيسية:**\n- دقة فائقة وتصميم عصري يواكب تطلعاتك.\n- أداء استثنائي يضمن لك راحة وثقة مطلقة.\n- جودة مصنعية عالية تدوم طويلاً.\n\n🛒 **اطلبه الآن ولا تفوت الفرصة واستمتع بعروض لفترة محدودة!**`;
                } else if (type === 'social') {
                    result = `📱 **حزمة منشورات السوشيال ميديا (جاهزة للنشر):**\n\n1️⃣ "ودع الطرق التقليدية واكتشف القوة الحقيقية مع ${product}! جاهز لتكون الأفضل؟ 🚀"\n2️⃣ "التصميم الذي تمناه الجميع أصبح بين يديك الآن. شاركنا رأيك في التعليقات! 👇\n\n#تسوق_مباشر #${product.replace(/\s+/g, '_')} #عروض_2026 #ابتكار"`;
                } else {
                    result = `🎯 **أفكار الحملات الإعلانية الممولة:**\n\n- **الإعلان الأول (فيديو ترويجي):** "هل تبحث عن الحل الأمثل؟ ${product} يأتيك ليختصر عليك الوقت والجهد. اضغط على الرابط واكتشف العرض!"\n- **الإعلان الثاني (صورة تفاعلية):** "لا تساوم على الجودة. امتلك ${product} اليوم وتميز عن الجميع."`;
                }

                outputBox.innerHTML = result;
            }, 1000);
        }

        function copyText() {
            const outputText = document.getElementById('output').innerText;
            navigator.clipboard.writeText(outputText);
            alert('تم نسخ المحتوى بنجاح إلى الحافظة! 📋');
        }

        function openCheckout() {
            alert('🚀 بوابة الدفع الآمنة (Stripe Checkout Integration):\n\nهنا يتم توجيه العميل لصفحة دفع مشفرة بـ 29$ شهرياً، وبمجرد إتمام الدفع، يقوم نظام الـ Webhook بتفعيل حسابه أوتوماتيكياً وتحويل الأرباح لحسابك.');
        }
    </script>

</body>
</html>
