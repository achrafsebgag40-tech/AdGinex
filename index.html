<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdGenix - المنصة الرقمية الاحترافية</title>

    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="AdGenix - المنصة الاحترافية للخدمات والأدوات الرقمية المتميزة.">
    <meta name="keywords" content="AdGenix, أدوات رقمية, تطوير ويب, تقنية">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ad-ginex.vercel.app/">
    <meta property="og:title" content="AdGenix - موقعك الرقمي الاحترافي">
    <meta property="og:description" content="منصة متقدمة تقدم لك خدمات وأدوات رقمية فريدة من نوعها.">

    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AdGenix</h1>
    </header>

    <main>
    <div class="hero-card">
        <h2>منصة AdGenix للذكاء الاصطناعي</h2>
        <p>أدخل اسم منتجك أو فكرتك، واترك الباقي لخوارزمياتنا المتقدمة لتوليد أفضل محتوى تسويقي.</p>

        <div class="input-group">
            <label>اسم المنتج أو الفكرة:</label>
            <input type="text" id="productName" placeholder="مثال: ساعة ذكية رياضية">
        </div>

        <div class="input-group">
            <label>نوع المحتوى المطلوبة:</label>
            <select id="contentType">
                <option value="description">وصف تسويقي احترافي</option>
                <option value="social">منشورات سوشيال ميديا</option>
                <option value="ads">أفكار حملات إعلانية</option>
            </select>
        </div>

        <input type="hidden" id="toneStyle" value="professional">

        <button class="btn-primary" onclick="generateContent()">توليد المحتوى الآن 🚀</button>

        <div id="output">ستظهر النتيجة هنا بعد التوليد...</div>

        <div class="action-buttons">
            <button class="btn-secondary" onclick="copyText()">نسخ المحتوى 📋</button>
            <button class="btn-secondary btn-success" onclick="openCheckout()">اشتراك مدفوع 💳</button>
        </div>
    </div>
</main>

    <footer>
        <p>جميع حقوق الملكية محفوظة &copy; 2026 AdGenix</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
